[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflare-gateway-dns-filter"
version = "2.0.0"
description = "Pihole-style DNS ad blocking using Cloudflare Gateway Zero Trust with a dedicated Allow rule."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cloudflare-gateway = "cloudflare_gateway.cli:main"

[tool.setuptools]
packages = ["cloudflare_gateway"]

[tool.ruff]
line-length = 100
target-version = "py310"
